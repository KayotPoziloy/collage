<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Коллаж</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="palette">
      <div class="changeColorContainer">
        <label for="brushColor">Color</label>
        <input type="color" id="brushColor" />
      </div>
      <div class="chooseBrushContainer">
        <label for="imageBrush">Image?</label>
        <input type="checkbox" id="imageBrush" />
      </div>
      <div class="changeBrushSizeContainer">
        <label for="brushSize">Brush size</label>
        <input type="range" id="brushSize" min="1" max="1000" />
      </div>
    </div>
    <canvas id="scrollCanvas" width="2000" height="1500"></canvas>
  </body>

  <script src="index.js"></script>
</html>
